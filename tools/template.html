<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>制动控制模块 DTC 查询</title>
<style>
  :root {
    --bg: #f2f4f7; --card: #fff; --text: #1f2937; --muted: #6b7280;
    --blue: #2a6db5; --blue-d: #22507f; --blue-l: #e8f0fa; --line: #d5dde8;
    --green: #0fbf5f; --tip-bg: #eef8ef; --tip-line: #bfe3c4; --red: #d93025;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
  .hero { background: linear-gradient(135deg, var(--blue-d), var(--blue)); color: #fff;
    border-radius: 16px; padding: 20px 20px 18px; margin-bottom: 14px; }
  .hero h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: .5px; }
  .hero p { margin: 0; opacity: .88; font-size: 14px; }
  .tag { display: inline-block; background: rgba(255,255,255,.2); border-radius: 6px; padding: 0 6px; font-size: 12px; margin-left: 6px; vertical-align: 3px; }
  .card { background: var(--card); border-radius: 16px; padding: 18px 16px; margin-bottom: 14px; }
  .step { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .num { width: 34px; height: 34px; border-radius: 50%; background: var(--blue); color: #fff;
    display: grid; place-items: center; font-weight: 700; flex: none; }
  .step h2 { margin: 0; font-size: 18px; }
  .step .cur { margin-left: auto; color: var(--blue); font-size: 14px; }
  .disabled { opacity: .45; pointer-events: none; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid button { padding: 14px 6px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff;
    color: var(--blue); font-size: 16px; cursor: pointer; }
  .grid button.on { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
  .search { display: flex; gap: 8px; }
  input.q { flex: 1; min-width: 0; font-size: 18px; padding: 12px 14px; border: 1.5px solid var(--line);
    border-radius: 12px; outline: none; text-transform: uppercase; font-family: ui-monospace, Menlo, Consolas, monospace; }
  input.q:focus { border-color: var(--blue); }
  .search button { padding: 0 16px; border: 0; border-radius: 12px; background: var(--blue); color: #fff; font-size: 16px; }
  .hint { color: var(--muted); font-size: 13px; margin: 8px 2px 0; }
  .msg { color: var(--muted); text-align: center; padding: 10px 0; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
  .list li:active, .list li:hover { background: var(--blue-l); }
  .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; color: var(--blue-d); }
  .bytes { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--muted); font-size: 13px; margin-left: 6px; }
  .list .d { font-size: 14px; margin-top: 2px; }
  .codes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .codes div { background: var(--blue-l); border-radius: 10px; padding: 8px; text-align: center; }
  .codes small { display: block; color: var(--muted); font-size: 12px; }
  .codes b { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 17px; color: var(--blue-d); }
  .sec { margin-bottom: 14px; }
  .sec h3 { margin: 0 0 4px; font-size: 15px; color: var(--blue-d); }
  .sec h3::before { content: ""; display: inline-block; width: 4px; height: 14px; background: var(--blue);
    border-radius: 2px; margin-right: 8px; vertical-align: -1px; }
  .sec .t { white-space: pre-wrap; background: #f8fafc; border-radius: 10px; padding: 10px 12px; font-size: 15px; }
  .sec details { margin-top: 4px; font-size: 13px; color: var(--muted); }
  .sec details div { white-space: pre-wrap; }
  .back { border: 0; background: none; color: var(--blue); font-size: 15px; padding: 0; margin-bottom: 10px; cursor: pointer; }
  .tip { background: var(--tip-bg); border: 1.5px solid var(--tip-line); border-radius: 14px; padding: 12px 14px;
    text-align: center; font-weight: 600; margin-bottom: 14px; }
  .notes { background: #e9edf2; border-radius: 14px; padding: 12px 14px; color: #555; font-size: 14px; }
  .notes p { margin: 4px 0; }
  .lock { text-align: center; }
  .lock input { width: 220px; max-width: 100%; text-align: center; letter-spacing: 12px; font-size: 26px;
    padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; outline: none; font-family: ui-monospace, Menlo, monospace; }
  .lock input:focus { border-color: var(--blue); }
  .lock .err { color: var(--red); min-height: 24px; margin-top: 8px; font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>🔧 制动控制模块 DTC 查询<span class="tag" id="tag" hidden>内部版</span></h1>
    <p>售后故障码自助查询 · 数据版本 V1.0</p>
    <p>👇 按 ①②③ 顺序操作</p>
  </div>

  <div class="card lock" id="lock" hidden>
    <div class="step" style="justify-content:center"><h2>🔒 请输入 6 位访问密码</h2></div>
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off">
    <div class="err" id="pinErr"></div>
  </div>

  <div id="app" hidden>
    <div class="card">
      <div class="step"><div class="num">1</div><h2>选择车型</h2></div>
      <div class="grid" id="models"></div>
    </div>

    <div class="card disabled" id="s2">
      <div class="step"><div class="num">2</div><h2>输入 DTC 码</h2><span class="cur" id="cur"></span></div>
      <form class="search" id="form" autocomplete="off">
        <input class="q" id="q" placeholder="如 U210088 / E10088 / E100" enterkeyhint="search" spellcheck="false">
        <button type="submit">查询</button>
      </form>
      <p class="hint">完整显示码或高中低字节 → 直接定位；只输高中字节 → 列出全部备选。“0x”前缀和空格会自动忽略。</p>
    </div>

    <div class="card" id="s3" hidden>
      <div class="step"><div class="num">3</div><h2 id="s3t">查询结果</h2></div>
      <div id="out"></div>
    </div>

    <div class="tip">💡 维修前请先确认车型与故障码对应正确</div>
    <div class="notes">
      <p>⚠️ 显示码为诊断仪上显示的码（如 U210088），高中字节/低字节为十六进制（如 E100 + 88）。</p>
      <p>⚠️ 微信内打不开？点右上角 ··· → <b>在浏览器中打开</b>。</p>
    </div>
  </div>
</div>

<script>
const MODE = '__MODE__';
const $ = id => document.getElementById(id);
const store = {
  get(s, k) { try { return window[s].getItem(k); } catch (e) { return null; } },
  set(s, k, v) { try { window[s].setItem(k, v); } catch (e) {} },
};
let DB = null, model = null, items = [];

const norm = s => s.toUpperCase().replace(/0X/g, '').replace(/[^0-9A-Z]/g, '');
// 显示码 → 3 字节 hex：首字母 P/C/B/U = 00/01/10/11 放在最高两位
function dispToHex(d) {
  const n = 'PCBU'.indexOf(d[0]);
  return n < 0 ? '' : ((n << 2) | parseInt(d[1], 16)).toString(16).toUpperCase() + d.slice(2);
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function start(data) {
  DB = data;
  $('lock').hidden = true;
  $('app').hidden = false;
  const box = $('models');
  DB.models.forEach((m, i) => {
    const b = document.createElement('button');
    b.textContent = m.model;
    b.onclick = () => pick(i);
    box.appendChild(b);
  });
  const last = DB.models.findIndex(m => m.model === store.get('localStorage', 'dtc_model'));
  if (last >= 0) pick(last, true);
}

function pick(i, silent) {
  model = DB.models[i];
  items = model.items.map(it => ({ ...it, b: it.hm + it.l, bd: dispToHex(it.d) }));
  [...$('models').children].forEach((b, j) => b.classList.toggle('on', i === j));
  $('s2').classList.remove('disabled');
  $('cur').textContent = model.model;
  store.set('localStorage', 'dtc_model', model.model);
  if ($('q').value) search(); else $('s3').hidden = true;
  if (!silent) $('q').focus();
}

function search() {
  const q = norm($('q').value);
  if (!model || !q) { $('s3').hidden = true; return; }
  $('s3').hidden = false;
  const exact = items.filter(it => it.d === q || it.b === q || it.bd === q);
  if (exact.length === 1) return detail(exact[0], false);
  let hits = exact;
  if (!hits.length && q.length >= 2)
    hits = items.filter(it => it.d.startsWith(q) || it.b.startsWith(q) || it.bd.startsWith(q));
  list(hits, q);
}

function list(hits, q) {
  $('s3t').textContent = hits.length ? `找到 ${hits.length} 条备选` : '查询结果';
  if (!hits.length) {
    $('out').innerHTML = `<div class="msg">「${esc(model.model)}」中没有找到 <span class="code">${esc(q)}</span><br>请核对车型和故障码</div>`;
    return;
  }
  $('out').innerHTML = '<ul class="list">' + hits.map((it, i) =>
    `<li data-i="${i}"><span class="code">${esc(it.d)}</span><span class="bytes">${esc(it.hm)} ${esc(it.l)}</span>` +
    `<div class="d">${esc(it.desc || '（未填写）')}</div></li>`).join('') + '</ul>';
  $('out').querySelectorAll('li').forEach(li => li.onclick = () => detail(hits[li.dataset.i], true));
}

function sec(title, it, k) {
  const en = it[k + '_en'] ? `<details><summary>查看英文原文</summary><div>${esc(it[k + '_en'])}</div></details>` : '';
  return `<div class="sec"><h3>${title}</h3><div class="t">${esc(it[k] || '（表中未填写）')}</div>${en}</div>`;
}

function detail(it, fromList) {
  $('s3t').textContent = '故障信息';
  $('out').innerHTML = (fromList ? '<button class="back" id="back">‹ 返回备选列表</button>' : '') +
    `<div class="codes"><div><small>显示码</small><b>${esc(it.d)}</b></div>` +
    `<div><small>高中字节</small><b>${esc(it.hm)}</b></div><div><small>低字节</small><b>${esc(it.l)}</b></div></div>` +
    sec('故障描述', it, 'desc') + sec('可能原因', it, 'cause') + sec('维修建议', it, 'fix');
  if (fromList) $('back').onclick = search;
  $('s3').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

let timer;
$('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 250); });
$('form').addEventListener('submit', e => { e.preventDefault(); $('q').blur(); search(); });

// ---- 加载数据 ----
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(enc, pin) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(enc.salt), iterations: enc.iter },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(enc.iv) }, key, b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

(async () => {
  if (MODE === 'pub') {
    start(await (await fetch('data.json', { cache: 'no-cache' })).json());
    return;
  }
  $('tag').hidden = false;
  $('lock').hidden = false;
  const enc = await (await fetch('data.enc.json', { cache: 'no-cache' })).json();
  const tryPin = async (pin, saved) => {
    $('pinErr').textContent = '验证中…';
    $('pin').disabled = true;
    try {
      start(await unlock(enc, pin));
      store.set('sessionStorage', 'dtc_pin', pin);
    } catch (e) {
      $('pinErr').textContent = saved ? '' : '密码错误，请重试';
      $('pin').disabled = false;
      $('pin').value = '';
      $('pin').focus();
    }
  };
  const saved = store.get('sessionStorage', 'dtc_pin');
  if (saved) tryPin(saved, true); else $('pin').focus();
  $('pin').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/\D/g, '');
    if (e.target.value.length === 6) tryPin(e.target.value, false);
  });
})();
</script>
</body>
</html>
